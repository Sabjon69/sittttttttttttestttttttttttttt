<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IRYON | Terminal Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #020202; color: white; font-family: 'Plus Jakarta Sans', sans-serif; }
        .admin-glass { background: rgba(239, 68, 68, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(239, 68, 68, 0.1); }
    </style>
</head>
<body class="flex items-center justify-center h-screen">
    <div class="admin-glass p-10 rounded-[2rem] text-center max-w-lg shadow-2xl border-t-4 border-t-red-500">
        <div class="w-20 h-20 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-6 border border-red-500/30">
            <i class="fa-solid fa-screwdriver-wrench text-3xl text-red-500"></i>
        </div>
        <h1 class="text-4xl font-black uppercase italic tracking-tighter mb-2 text-white">Console <span class="text-red-500">Admin</span></h1>
        <p class="text-red-400/60 uppercase text-[10px] tracking-[0.3em] font-bold mb-8">Niveau d'accès : Root</p>
        
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-black/60 p-4 rounded-xl border border-red-500/10">
                <p class="text-red-500 font-bold text-xl">1.2k</p>
                <p class="text-[8px] uppercase text-slate-500">Users</p>
            </div>
            <div class="bg-black/60 p-4 rounded-xl border border-red-500/10">
                <p class="text-red-500 font-bold text-xl">0</p>
                <p class="text-[8px] uppercase text-slate-500">Alerts</p>
            </div>
        </div>

        <button onclick="window.location.href='/login'" class="text-slate-500 hover:text-red-500 text-xs font-bold uppercase transition-all">
            <i class="fa-solid fa-terminal mr-2"></i> Quitter le Terminal
        </button>
    </div>
</body>
</html>
