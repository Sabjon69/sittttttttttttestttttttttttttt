<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRYON | Liaison Terminal</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800;1000&display=swap');

        :root {
            --primary: #6366f1;
            --bg: #020202;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            margin: 0;
            color: #e2e8f0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .bg-grid {
            position: fixed; inset: 0;
            background-image: radial-gradient(circle at 2px 2px, rgba(99, 102, 241, 0.05) 1px, transparent 0);
            background-size: 40px 40px;
            z-index: -1;
        }

        /* --- NAVIGATION RESPONSIVE --- */
        .sidebar-fixed {
            width: 300px;
            height: 100vh;
            background: #050505;
            border-right: 1px solid rgba(255, 255, 255, 0.03);
            position: fixed; left: 0; top: 0;
            display: flex; flex-direction: column;
            z-index: 2000;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .main-container {
            margin-left: 300px;
            min-height: 100vh;
            transition: all 0.4s;
            width: calc(100% - 300px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 1024px) {
            .sidebar-fixed { transform: translateX(-100%); width: 280px; }
            .sidebar-fixed.open { transform: translateX(0); box-shadow: 20px 0 50px rgba(0,0,0,0.9); }
            .main-container { margin-left: 0; width: 100%; padding-top: 80px; }
        }

        /* --- LOGIN CARD EFFECTS --- */
        .glass-panel {
            background: rgba(13, 17, 23, 0.7);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .scanline {
            width: 100%; height: 2px; z-index: 5;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            position: absolute;
            animation: scanline 4s linear infinite;
            opacity: 0.3;
        }
        @keyframes scanline { 0% { top: 0%; } 100% { top: 100%; } }

        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        input {
            background: rgba(0, 0, 0, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            transition: all 0.3s ease !important;
            color: white !important;
        }
        input:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
            outline: none;
        }

        .dot-live {
            width: 8px; height: 8px; background: var(--primary); border-radius: 50%;
            box-shadow: 0 0 10px var(--primary); animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } }

        #menu-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 1500;
        }
        #menu-overlay.active { display: block; }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased">

    <div id="menu-overlay" onclick="toggleSidebar()"></div>
    <div class="bg-grid"></div>

    <header class="lg:hidden fixed top-0 left-0 w-full flex items-center justify-between px-5 py-4 bg-[#050505]/90 backdrop-blur-xl border-b border-white/5 z-[1100]">
        <div class="flex items-center gap-4" onclick="window.location.href='../index.html'">
            <div class="w-12 h-12 bg-indigo-500/10 border border-indigo-500/20 rounded-xl flex items-center justify-center overflow-hidden">
                <img src="assets/logo.png" alt="Logo" class="w-full h-full object-contain p-1 transform scale-125">
            </div>
            <div class="flex flex-col">
                <h1 class="font-black uppercase tracking-tighter text-white italic text-xl leading-none">IRYON</h1>
                <div class="flex items-center gap-2">
                    <div class="dot-live"></div>
                    <span class="text-[8px] text-slate-500 font-bold uppercase tracking-widest leading-none">Access Liaison</span>
                </div>
            </div>
        </div>
        <button onclick="toggleSidebar()" class="w-12 h-12 flex items-center justify-center rounded-xl bg-white/5 border border-white/10 text-white text-xl">
            <i class="fa-solid fa-bars-staggered" id="menu-icon"></i>
        </button>
    </header>

    <aside id="sidebar" class="sidebar-fixed">
        <div class="p-6 lg:p-8 border-b border-white/[0.03] relative overflow-hidden flex items-center">
            <div class="absolute -left-5 -top-5 w-24 h-24 bg-indigo-600/10 blur-[40px] rounded-full"></div>
            <div class="flex items-center gap-4 group cursor-pointer relative z-10" onclick="window.location.href='../index.html'">
                <div class="w-12 h-12 lg:w-14 lg:h-14 bg-white/[0.02] border border-white/10 rounded-xl flex items-center justify-center shadow-2xl overflow-hidden">
                    <img src="assets/logo.png" alt="Logo" class="w-full h-full object-contain transform scale-125">
                </div>
                <div>
                    <h1 class="text-xl lg:text-2xl font-black text-white uppercase tracking-tighter leading-none italic">IRYON<br><span class="text-indigo-500 not-italic">ENCHÈRES</span></h1>
                </div>
            </div>
        </div>
        
        <nav class="flex-1 px-4 py-8 space-y-1 overflow-y-auto scrollbar-hide">
            <button onclick="window.location.href='../index.html'" class="w-full flex items-center gap-4 p-3.5 rounded-xl text-slate-500 hover:bg-white/5 transition-all">
                <i class="fa-solid fa-house text-lg"></i> <span class="font-bold text-sm tracking-wide">Tableau de Bord</span>
            </button>
            <button onclick="window.location.href='live.html'" class="w-full flex items-center gap-4 p-3.5 rounded-xl text-slate-500 hover:bg-white/5 transition-all">
                <i class="fa-solid fa-chart-line text-lg"></i> <span class="font-bold text-sm tracking-wide">Marché Live</span>
            </button>
            <button onclick="window.location.href='register.html'" class="w-full flex items-center gap-4 p-3.5 rounded-xl text-slate-500 hover:bg-white/5 transition-all">
                <i class="fa-solid fa-user-plus text-lg"></i> <span class="font-bold text-sm tracking-wide">Créer un Accès</span>
            </button>
            <div class="h-px bg-white/[0.03] my-6 mx-4"></div>
            <button class="w-full flex items-center gap-4 p-3.5 rounded-xl nav-active text-white">
                <i class="fa-solid fa-fingerprint text-lg text-indigo-400"></i> <span class="font-bold text-sm tracking-wide">S'identifier</span>
            </button>
        </nav>
    </aside>

    <main class="main-container">
        <div class="w-full max-w-md px-4 py-8">
            
            <div id="error-box" class="hidden mb-6 p-4 rounded-2xl bg-red-500/10 border border-red-500/30 flex items-center gap-4 animate-slide-up">
                <i class="fa-solid fa-triangle-exclamation text-red-500"></i>
                <div>
                    <p class="text-[9px] font-black text-red-500 uppercase tracking-widest">Échec Liaison</p>
                    <p class="text-[10px] text-red-200/60 font-medium italic">Clé ou ID invalide.</p>
                </div>
            </div>

            <div id="login-card" class="relative glass-panel p-8 lg:p-12 rounded-[2.5rem] lg:rounded-[3rem] overflow-hidden shadow-2xl border border-white/5">
                
                <div class="scanline"></div>
                
                <div class="text-center mb-10 relative z-10">
                    <div class="w-16 h-16 bg-indigo-500/10 rounded-2xl flex items-center justify-center mx-auto mb-5 border border-indigo-500/20 shadow-2xl">
                        <i class="fa-solid fa-shield-halved text-3xl text-indigo-500"></i>
                    </div>
                    <h2 class="text-2xl lg:text-3xl font-[1000] text-white uppercase italic tracking-tighter leading-none">Liaison <span class="text-indigo-500">Réseau</span></h2>
                    <p class="text-slate-600 text-[8px] font-black uppercase tracking-[0.4em] mt-3">Quantum Auth v2.0</p>
                </div>

                <div class="space-y-6 relative z-10">
                    <div class="group">
                        <label class="block text-[9px] text-slate-500 font-black uppercase tracking-widest mb-3 ml-2 italic">Terminal ID</label>
                        <div class="relative">
                            <i class="fa-solid fa-at absolute left-5 top-1/2 -translate-y-1/2 text-slate-700 group-focus-within:text-indigo-500 transition-colors"></i>
                            <input type="email" id="email" 
                                class="w-full py-4 pl-12 pr-6 rounded-xl text-sm font-bold placeholder:text-slate-800" 
                                placeholder="votre@email.com" required>
                        </div>
                    </div>

                    <div class="group">
                        <label class="block text-[9px] text-slate-500 font-black uppercase tracking-widest mb-3 ml-2 italic">Clé Crypter</label>
                        <div class="relative">
                            <i class="fa-solid fa-key absolute left-5 top-1/2 -translate-y-1/2 text-slate-700 group-focus-within:text-indigo-500 transition-colors"></i>
                            <input type="password" id="password" 
                                class="w-full py-4 pl-12 pr-6 rounded-xl text-sm font-bold placeholder:text-slate-800" 
                                placeholder="••••••••" required>
                        </div>
                    </div>
                    
                    <div class="pt-4">
                        <button onclick="executeLogin()" id="btn-login" class="w-full h-16 lg:h-20 rounded-2xl bg-white text-black font-black uppercase text-[10px] tracking-[0.4em] transition-all hover:bg-indigo-600 hover:text-white active:scale-95 shadow-xl flex items-center justify-center">
                            <span id="btn-text">Initialiser Liaison</span>
                        </button>
                    </div>

                    <div class="text-center pt-2">
                        <button onclick="window.location.href='register.html'" class="text-[9px] font-black text-slate-500 uppercase tracking-widest hover:text-white transition-all">
                            Pas de profil ? <span class="text-indigo-500">Créer un accès</span>
                        </button>
                    </div>
                </div>

                <div class="mt-8 pt-6 border-t border-white/5 text-center">
                    <a href="../index.html" class="text-[9px] font-black text-slate-700 uppercase tracking-[0.3em] hover:text-white transition-colors">
                        <i class="fa-solid fa-chevron-left mr-2 text-[7px]"></i> Retour Terminal
                    </a>
                </div>
            </div>

            <p class="mt-8 text-center text-[8px] font-black text-slate-800 uppercase tracking-[0.5em] italic">
                Secure Link Encryption Active
            </p>
        </div>
    </main>

    <script>
        // NAVIGATION MOBILE
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('menu-overlay');
            const icon = document.getElementById('menu-icon');
            
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
            
            if(sidebar.classList.contains('open')) {
                icon.classList.replace('fa-bars-staggered', 'fa-xmark');
                document.body.style.overflow = 'hidden';
            } else {
                icon.classList.replace('fa-xmark', 'fa-bars-staggered');
                document.body.style.overflow = 'auto';
            }
        }

        // LOGIQUE LOGIN
        function executeLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');
            const btnText = document.getElementById('btn-text');
            const errorBox = document.getElementById('error-box');
            const card = document.getElementById('login-card');

            errorBox.classList.add('hidden');
            card.classList.remove('shake');

            if (!email || !password) {
                showError();
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = '<i class="fa-solid fa-circle-notch animate-spin mr-3"></i> SYNC...';

            setTimeout(() => {
                // Simulation succès basique
                if (email.includes("@") && password.length >= 4) {
                    btnText.innerHTML = 'SUCCESS';
                    btn.classList.replace('bg-white', 'bg-emerald-500');
                    btn.classList.add('text-white');
                    setTimeout(() => { window.location.href = "../index.html"; }, 800);
                } else {
                    showError();
                    btn.disabled = false;
                    btnText.innerHTML = "Initialiser Liaison";
                }
            }, 1500);
        }

        function showError() {
            const errorBox = document.getElementById('error-box');
            const card = document.getElementById('login-card');
            errorBox.classList.remove('hidden');
            card.classList.add('shake');
        }
    </script>
</body>
</html>
