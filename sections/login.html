<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRYON | Liaison Terminal</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800;1000&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #020202;
            margin: 0;
            color: #e2e8f0;
            min-height: 100vh;
        }

        .bg-grid {
            position: fixed; inset: 0;
            background-image: radial-gradient(circle at 2px 2px, rgba(99, 102, 241, 0.05) 1px, transparent 0);
            background-size: 40px 40px;
            z-index: -1;
        }

        .scanline {
            width: 100%;
            height: 2px;
            z-index: 5;
            background: rgba(99, 102, 241, 0.2);
            position: absolute;
            animation: scanline 6s linear infinite;
        }
        @keyframes scanline { 0% { top: 0; } 100% { top: 100%; } }

        .glass-panel {
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        input {
            background: rgba(0, 0, 0, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
            color: white !important;
        }
        input:focus {
            border-color: #6366f1 !important;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.1);
            outline: none;
        }

        .dot-live {
            width: 8px; height: 8px;
            background: #6366f1;
            border-radius: 50%;
            box-shadow: 0 0 10px #6366f1;
            animation: pulse-indigo 2s infinite;
        }
        @keyframes pulse-indigo {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="antialiased">

    <div class="bg-grid"></div>

    <header class="lg:hidden flex items-center justify-between p-6 bg-[#050505]/95 backdrop-blur-xl border-b border-white/5 sticky top-0 z-[1100] min-h-[140px]">
    <div class="flex items-center gap-6" onclick="window.location.href='index.html'">
        <div class="w-[100px] h-[100px] bg-indigo-500/5 border border-indigo-500/20 rounded-[2rem] flex items-center justify-center overflow-hidden shadow-[0_0_40px_rgba(79,70,229,0.2)]">
            <img src="./sections/assets/logo.png" 
                 alt="Logo IRYON" 
                 class="w-full h-full object-contain p-1 transform scale-150"
                 onerror="this.src='https://via.placeholder.com/100?text=Logo+Err'">
        </div>
        <div class="flex flex-col">
            <h1 class="font-[1000] uppercase tracking-tighter text-white italic text-4xl leading-[0.8] mb-2">IRYON<br><span class="text-indigo-500 not-italic">ENCHÈRES</span></h1>
            <div class="flex items-center gap-2">
                <div class="dot-live"></div>
                <span class="text-[10px] text-slate-500 font-black uppercase tracking-[0.4em] italic">Quantum Live</span>
            </div>
        </div>
    </div>
    <button onclick="toggleSidebar()" class="w-16 h-16 flex items-center justify-center rounded-[1.5rem] bg-white/5 border border-white/10 text-white text-3xl">
        <i class="fa-solid fa-bars-staggered" id="menu-icon"></i>
    </button>
</header>

    <div class="flex flex-col items-center justify-center min-h-[calc(100vh-140px)] p-6">
        
        <div class="w-full max-w-md">
            
            <div id="error-box" class="hidden mb-6 p-5 rounded-[1.5rem] bg-red-500/10 border border-red-500/30 flex items-center gap-4">
                <i class="fa-solid fa-triangle-exclamation text-red-500 text-xl"></i>
                <div>
                    <p class="text-[10px] font-black text-red-500 uppercase tracking-widest leading-none mb-1 text-left">Échec de Synchronisation</p>
                    <p class="text-[11px] text-red-200/60 font-medium">Email ou clé d'accès incorrecte.</p>
                </div>
            </div>

            <div id="login-card" class="relative glass-panel p-10 md:p-14 rounded-[3rem] overflow-hidden shadow-2xl">
                
                <div class="scanline"></div>
                
                <div class="text-center mb-10 relative z-10">
                    <div class="w-20 h-20 bg-indigo-500/10 rounded-[1.5rem] flex items-center justify-center mx-auto mb-6 border border-indigo-500/20 shadow-[0_0_40px_rgba(79,70,229,0.15)]">
                        <i class="fa-solid fa-shield-halved text-4xl text-indigo-500"></i>
                    </div>
                    <h2 class="text-3xl font-[1000] text-white uppercase italic tracking-tighter">Liaison <span class="text-indigo-500">Réseau</span></h2>
                    <p class="text-slate-500 text-[9px] font-black uppercase tracking-[0.4em] mt-3">Auth Protocol IRYON-v2.0</p>
                </div>

                <div class="space-y-6 relative z-10">
                    
                    <div class="group">
                        <label class="block text-[10px] text-slate-500 font-black uppercase tracking-widest mb-3 ml-2">Identifiant Terminal</label>
                        <div class="relative">
                            <i class="fa-solid fa-envelope absolute left-5 top-1/2 -translate-y-1/2 text-slate-700 group-focus-within:text-indigo-500 transition-colors"></i>
                            <input type="email" id="email" 
                                class="w-full py-5 pl-14 pr-6 rounded-2xl text-sm font-bold placeholder:text-slate-800" 
                                placeholder="votre@email.com" required>
                        </div>
                    </div>

                    <div class="group">
                        <label class="block text-[10px] text-slate-500 font-black uppercase tracking-widest mb-3 ml-2">Clé Cryptographique</label>
                        <div class="relative">
                            <i class="fa-solid fa-key absolute left-5 top-1/2 -translate-y-1/2 text-slate-700 group-focus-within:text-indigo-500 transition-colors"></i>
                            <input type="password" id="password" 
                                class="w-full py-5 pl-14 pr-6 rounded-2xl text-sm font-bold placeholder:text-slate-800" 
                                placeholder="••••••••••••" required>
                        </div>
                    </div>
                    
                    <button onclick="executeLogin()" id="btn-login" class="group relative w-full h-20 rounded-2xl bg-white text-black font-[1000] uppercase text-[11px] tracking-[0.4em] transition-all hover:bg-indigo-600 hover:text-white active:scale-95 shadow-xl flex items-center justify-center">
                        <span id="btn-text">Initialiser Liaison</span>
                    </button>

                    <div class="text-center pt-4">
                        <button onclick="window.location.href='register.html'" class="text-[10px] font-black text-slate-500 uppercase tracking-widest hover:text-indigo-400 transition-all">
                            Pas d'accès ? <span class="text-indigo-500 underline underline-offset-4">Ouvrir un compte</span>
                        </button>
                    </div>
                </div>

                <div class="mt-10 pt-6 border-t border-white/5 text-center">
                    <a href="../index.html" class="text-[10px] font-black text-slate-700 uppercase tracking-[0.3em] hover:text-white transition-colors">
                        <i class="fa-solid fa-chevron-left mr-2 text-[8px]"></i> Retour Terminal
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function executeLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');
            const btnText = document.getElementById('btn-text');
            const errorBox = document.getElementById('error-box');
            const card = document.getElementById('login-card');

            errorBox.classList.add('hidden');
            card.classList.remove('shake');

            if (!email || !password) {
                showError();
                return;
            }

            btn.disabled = true;
            btnText.innerHTML = '<i class="fa-solid fa-spinner animate-spin mr-3"></i> SYNCHRONISATION...';

            setTimeout(() => {
                // Simulation succès
                if (email.includes("@") && password.length >= 4) {
                    btnText.innerHTML = 'LIAISON ÉTABLIE';
                    btn.classList.replace('bg-white', 'bg-emerald-500');
                    btn.classList.add('text-white');
                    setTimeout(() => { window.location.href = "../index.html"; }, 800);
                } else {
                    showError();
                    btn.disabled = false;
                    btnText.innerHTML = "Initialiser Liaison";
                }
            }, 1800);
        }

        function showError() {
            const errorBox = document.getElementById('error-box');
            const card = document.getElementById('login-card');
            errorBox.classList.remove('hidden');
            card.classList.add('shake');
        }
    </script>
</body>
</html>
