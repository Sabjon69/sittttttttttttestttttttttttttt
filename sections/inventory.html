<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropBid - Inventaire</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes viewEnter {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-view-enter {
            animation: viewEnter 0.5s ease-out forwards;
        }
        .glass-panel {
            background: rgba(1, 4, 9, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-300 min-h-screen">

    <div class="max-w-7xl mx-auto px-4 py-10 lg:px-8">
        
        <div class="animate-view-enter space-y-10">
            
            <div class="relative overflow-hidden flex flex-col md:flex-row justify-between items-start md:items-center gap-6 bg-[#010409]/60 backdrop-blur-xl p-10 rounded-[2.5rem] border border-white/[0.03] shadow-2xl">
                <div class="absolute -top-24 -right-24 w-64 h-64 bg-indigo-600/10 rounded-full blur-[100px] pointer-events-none"></div>
                
                <div class="relative z-10">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_8px_#10b981]"></span>
                        <p class="text-[10px] text-emerald-500 font-black uppercase tracking-[0.3em]">Protocole de Sécurité Actif</p>
                    </div>
                    <h2 class="text-4xl font-black text-white uppercase tracking-tighter italic leading-none">Mon <span class="text-indigo-500">Coffre-Fort</span></h2>
                    <p class="text-slate-500 text-xs font-medium mt-3 uppercase tracking-widest opacity-70 italic">Gestion de vos actifs authentifiés sur le réseau</p>
                </div>

                <div class="relative z-10 flex items-center gap-6 bg-black/40 p-4 rounded-3xl border border-white/[0.05] min-w-[220px]">
                    <div class="text-right flex-1">
                        <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest mb-1">Valeur Estimée</p>
                        <p id="total-inv-value" class="text-2xl font-mono font-bold text-white tracking-tighter">0.00€</p>
                    </div>
                    <div class="w-14 h-14 bg-indigo-600/20 rounded-2xl flex items-center justify-center text-indigo-400 border border-indigo-500/30 shadow-[0_0_15px_rgba(79,70,229,0.2)]">
                        <i class="fa-solid fa-vault text-2xl"></i>
                    </div>
                </div>
            </div>

            <div id="inv-empty" class="group text-center py-32 bg-[#010409]/40 rounded-[3.5rem] border border-dashed border-white/5 hover:border-indigo-500/20 transition-all duration-500">
                <div class="relative inline-block mb-10">
                    <div class="absolute inset-0 bg-indigo-500/5 rounded-full animate-ping scale-150 opacity-20"></div>
                    <div class="w-28 h-28 bg-slate-900/80 rounded-full flex items-center justify-center border border-white/5 relative z-10">
                        <i class="fa-solid fa-box-open text-5xl text-slate-700 group-hover:text-indigo-500/50 transition-colors duration-500"></i>
                    </div>
                    <div class="absolute -top-2 -right-2 w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center text-white text-sm animate-bounce shadow-[0_0_20px_rgba(79,70,229,0.4)] border border-indigo-400/30">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                </div>
                <h3 class="text-2xl text-white font-black mb-4 uppercase tracking-tight leading-none">Aucun actif détecté</h3>
                <p class="text-slate-500 max-w-xs mx-auto text-sm leading-relaxed font-medium opacity-80">
                    Votre inventaire est actuellement vide. Explorez le marché pour acquérir vos premiers biens.
                </p>
                <button onclick="switchTab('live', event)" class="mt-10 px-10 py-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-black text-[11px] uppercase tracking-[0.2em] transition-all duration-300 shadow-xl active:scale-95 border border-indigo-400/30">
                    Scanner le Marché
                </button>
            </div>

            <div id="inv-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 hidden">
                </div>

        </div>
    </div>  

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if(typeof renderInventory === 'function') {
                renderInventory();
            }
        });
    </script>
</body>
</html>
