<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropBid | Inventaire Quantum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500;800&display=swap');
        
        :root { --p: #6366f1; --bg: #050505; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; margin: 0; overflow-x: hidden; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .nav-item:hover { background: rgba(255, 255, 255, 0.02); color: white; }
        .active-tab { border-right: 3px solid var(--p); background: rgba(99, 102, 241, 0.05); color: white !important; }

        /* Animation d'entrée */
        @keyframes viewEnter {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-view-enter { animation: viewEnter 0.5s ease-out forwards; }

        /* Sidebar Responsive Logic */
        @media (max-width: 1023px) {
            #sidebar { transform: translateX(-100%); width: 280px; }
            #sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0 !important; }
        }
    </style>
</head>
<body class="min-h-screen flex">

<header class="lg:hidden fixed top-0 left-0 w-full bg-[#050505]/90 backdrop-blur-xl border-b border-white/[0.05] p-4 flex justify-between items-center z-[1100]">
    
    <div class="flex items-center gap-3 group" onclick="window.location.href='index.html'">
        <div class="relative w-10 h-10 bg-gradient-to-br from-white/[0.05] to-transparent border border-white/10 rounded-xl flex items-center justify-center overflow-hidden shadow-[0_0_15px_rgba(99,102,241,0.1)]">
            <img src="../assets/Sans titre (1).png" 
                 alt="Logo IRYON" 
                 class="w-full h-full object-contain p-1 transform scale-125 transition-transform duration-500 group-active:scale-150">
        </div>

        <div class="flex flex-col justify-center">
            <span class="font-[1000] uppercase tracking-tighter text-white text-xs leading-none italic">
                IRYON <span class="text-indigo-500 not-italic">ENCHÈRES</span>
            </span>
            <div class="flex items-center gap-1 mt-1">
                <span class="w-1 h-1 bg-indigo-500 rounded-full animate-pulse shadow-[0_0_5px_#6366f1]"></span>
                <span class="text-[7px] text-slate-500 font-black uppercase tracking-[0.2em]">Quantum Live</span>
            </div>
        </div>
    </div>

    <button onclick="toggleMenu()" class="w-10 h-10 flex items-center justify-center rounded-xl bg-white/[0.03] border border-white/5 active:bg-indigo-600/20 active:border-indigo-500/30 transition-all text-white">
        <i class="fa-solid fa-bars-staggered text-lg" id="menu-icon"></i>
    </button>
</header>

   <aside id="sidebar" class="fixed left-0 top-0 h-full w-20 lg:w-80 bg-[#050505] border-r border-white/[0.05] flex flex-col z-[1000] transition-all duration-500 shadow-[10px_0_30px_rgba(0,0,0,0.5)]">
    
    <div class="p-4 lg:p-10 border-b border-white/[0.03] relative overflow-hidden flex items-center justify-center lg:justify-start min-h-[100px] lg:min-h-[160px]">
        <div class="absolute -left-5 -top-5 w-32 h-32 bg-indigo-600/10 blur-[50px] rounded-full pointer-events-none"></div>

        <div class="flex items-center gap-6 group cursor-pointer relative z-10" onclick="window.location.href='../index.html'">
            <div class="w-14 h-14 lg:w-20 lg:h-20 bg-gradient-to-br from-white/[0.05] to-transparent border border-white/10 rounded-2xl flex items-center justify-center shadow-[0_0_30px_rgba(79,70,229,0.2)] group-hover:rotate-3 group-hover:scale-105 group-hover:border-indigo-500/50 transition-all duration-500 overflow-hidden text-center">
                <img src="../assets/Sans titre (1).png" 
                     alt="Logo IRYON" 
                     class="w-full h-full object-contain p-2 transform scale-125 transition-transform duration-700 group-hover:scale-150">
            </div>

            <div class="hidden lg:block">
                <h1 class="text-2xl lg:text-3xl font-[1000] text-white uppercase tracking-tighter leading-[0.85] italic">
                    IRYON<br><span class="text-indigo-500 not-italic">ENCHÈRES</span>
                </h1>
                <div class="flex items-center gap-2 mt-3">
                    <div class="flex h-2 w-2 relative">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-indigo-500"></span>
                    </div>
                    <p class="text-[9px] text-slate-500 font-black tracking-[0.4em] uppercase italic leading-none">Quantum Terminal</p>
                </div>
            </div>
        </div>
    </div>
    
    <div class="p-4 lg:p-8 border-b border-white/[0.03] space-y-3">
        <button onclick="window.location.href='register.html'" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-4 rounded-2xl text-[10px] lg:text-[11px] font-black uppercase tracking-[0.2em] transition-all flex items-center justify-center shadow-lg shadow-indigo-500/20">
            <i class="fa-solid fa-user-plus text-lg lg:text-sm"></i> <span class="hidden lg:inline ml-3">Créer un Accès</span>
        </button>
        <button onclick="window.location.href='login.html'" class="w-full bg-white/5 border border-white/10 hover:border-indigo-500/50 text-slate-400 hover:text-white py-4 rounded-2xl text-[10px] lg:text-[11px] font-black uppercase tracking-[0.2em] transition-all flex items-center justify-center">
            <i class="fa-solid fa-fingerprint text-lg lg:text-sm"></i> <span class="hidden lg:inline ml-3">S'identifier</span>
        </button>
    </div>

    <nav class="flex-1 px-3 lg:px-6 py-8 space-y-2 overflow-y-auto no-scrollbar">
        <p class="hidden lg:block text-[9px] text-slate-600 font-black uppercase tracking-[0.4em] px-6 mb-6">Menu Terminal</p>
        
        <button onclick="window.location.href='../index.html'" class="group w-full flex items-center justify-center lg:justify-start gap-5 p-5 rounded-2xl text-slate-500 hover:bg-white/5 transition-all">
            <i class="fa-solid fa-house text-xl group-hover:text-indigo-400"></i> 
            <span class="hidden lg:block font-bold text-sm tracking-wide">Tableau de Bord</span>
        </button>

        <button onclick="window.location.href='live.html'" class="group w-full flex items-center justify-center lg:justify-start gap-5 p-5 rounded-2xl text-slate-500 hover:bg-white/5 transition-all">
            <i class="fa-solid fa-chart-line text-xl group-hover:text-indigo-400"></i> 
            <span class="hidden lg:block font-bold text-sm tracking-wide">Marché Live</span>
        </button>

        <button onclick="window.location.href='offer.html'" class="group w-full flex items-center justify-center lg:justify-start gap-5 p-5 rounded-2xl text-slate-500 hover:bg-white/5 transition-all">
            <i class="fa-solid fa-tag text-xl group-hover:text-indigo-400"></i> 
            <span class="hidden lg:block font-bold text-sm tracking-wide">Déposer une offre</span>
        </button>

        <button class="w-full flex items-center justify-center lg:justify-start gap-5 p-5 rounded-2xl bg-indigo-500/10 text-white border border-indigo-500/20 shadow-[0_0_20px_rgba(99,102,241,0.1)]">
            <i class="fa-solid fa-vault text-xl text-indigo-400"></i> 
            <span class="hidden lg:block font-bold text-sm tracking-wide">Mon Inventaire</span>
        </button>

        <div class="h-px bg-white/[0.03] my-8 mx-6"></div>

        <button onclick="window.location.href='guide.html'" class="group w-full flex items-center justify-center lg:justify-start gap-5 p-5 rounded-2xl text-slate-500 hover:bg-white/5 transition-all">
            <i class="fa-solid fa-circle-info text-xl group-hover:text-indigo-400"></i> 
            <span class="hidden lg:block font-bold text-sm tracking-wide">Aide & Guide</span>
        </button>
    </nav>

    <div class="p-8 bg-black/40 border-t border-white/[0.03] flex justify-center lg:justify-start">
        <div class="flex items-center gap-4">
            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
            <span class="hidden lg:inline text-[10px] font-black text-slate-500 uppercase tracking-widest italic">System Online</span>
        </div>
    </div>
</aside>

    <main class="main-content flex-1 ml-20 lg:ml-80 p-4 md:p-8 lg:p-12 mt-16 lg:mt-0 transition-all">
        <div class="max-w-6xl mx-auto animate-view-enter">
            
            <div class="relative overflow-hidden flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6 bg-[#0d1117]/60 backdrop-blur-xl p-6 md:p-10 rounded-[2rem] md:rounded-[2.5rem] border border-white/[0.03] shadow-2xl mb-8 md:mb-12">
                <div class="absolute -top-24 -right-24 w-64 h-64 bg-indigo-600/10 rounded-full blur-[100px] pointer-events-none"></div>
                
                <div class="relative z-10">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_8px_#10b981]"></span>
                        <p class="text-[9px] md:text-[10px] text-emerald-500 font-black uppercase tracking-[0.3em]">Protocole de Sécurité Actif</p>
                    </div>
                    <h2 class="text-3xl md:text-4xl font-black text-white uppercase tracking-tighter italic">Mon <span class="text-indigo-500">Coffre-Fort</span></h2>
                </div>

                <div class="relative z-10 flex items-center gap-4 md:gap-6 bg-black/40 p-4 rounded-2xl md:rounded-3xl border border-white/[0.05] w-full md:w-auto min-w-[220px]">
                    <div class="text-right flex-1">
                        <p class="text-[8px] md:text-[9px] text-slate-500 font-bold uppercase tracking-widest mb-1">Valeur Estimée</p>
                        <p class="text-xl md:text-2xl font-mono font-bold text-white tracking-tighter">0.00€</p>
                    </div>
                    <div class="w-12 h-12 md:w-14 md:h-14 bg-indigo-600/20 rounded-xl md:rounded-2xl flex items-center justify-center text-indigo-400 border border-indigo-500/30">
                        <i class="fa-solid fa-vault text-xl md:text-2xl"></i>
                    </div>
                </div>
            </div>

            <div id="inv-empty" class="group text-center py-20 md:py-32 bg-[#0d1117]/20 rounded-[2.5rem] md:rounded-[3.5rem] border border-dashed border-white/5 px-4">
                <i class="fa-solid fa-box-open text-5xl md:text-6xl text-slate-800 mb-6 group-hover:text-indigo-500/20 transition-colors"></i>
                <h3 class="text-xl md:text-2xl text-white font-black uppercase mb-4">Aucun actif détecté</h3>
                <p class="text-slate-500 max-w-xs mx-auto text-sm mb-10">Votre inventaire est actuellement vide. Les actifs acquis via le Marché Live apparaîtront ici.</p>
                <button onclick="window.location.href='live.html'" class="w-full md:w-auto px-8 py-4 bg-white text-black rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-indigo-500 hover:text-white transition-all shadow-xl">
                    Scanner le Marché
                </button>
            </div>

        </div>
    </main>

    <script>
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const icon = document.getElementById('menu-icon');
            sidebar.classList.toggle('open');
            if(sidebar.classList.contains('open')) {
                icon.classList.replace('fa-bars-staggered', 'fa-xmark');
            } else {
                icon.classList.replace('fa-xmark', 'fa-bars-staggered');
            }
        }

        // Fermer le menu si on clique en dehors (sur mobile)
        document.addEventListener('click', (e) => {
            const sidebar = document.getElementById('sidebar');
            const menuBtn = document.querySelector('header button');
            if (window.innerWidth < 1024 && 
                sidebar.classList.contains('open') && 
                !sidebar.contains(e.target) && 
                !menuBtn.contains(e.target)) {
                toggleMenu();
            }
        });
    </script>
</body>
</html>
