<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropBid | Inventaire Quantum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500;800&display=swap');
        
        :root { --p: #6366f1; --bg: #050505; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; margin: 0; overflow-x: hidden; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .nav-item:hover { background: rgba(255, 255, 255, 0.02); color: white; }
        .active-tab { border-right: 3px solid var(--p); background: rgba(99, 102, 241, 0.05); color: white !important; }

        /* Animation d'entrée */
        @keyframes viewEnter {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-view-enter { animation: viewEnter 0.5s ease-out forwards; }

        /* Sidebar Responsive Logic */
        @media (max-width: 1023px) {
            #sidebar { transform: translateX(-100%); width: 280px; }
            #sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0 !important; }
        }
    </style>
</head>
<body class="min-h-screen flex">

    <header class="lg:hidden fixed top-0 left-0 w-full bg-[#050505] border-b border-white/5 p-4 flex justify-between items-center z-[1100]">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
                <i class="fa-solid fa-infinity text-white text-sm"></i>
            </div>
            <span class="font-black uppercase tracking-tighter text-white text-sm">Drop<span class="text-indigo-500">Bid</span></span>
        </div>
        <button onclick="toggleMenu()" class="text-white p-2">
            <i class="fa-solid fa-bars-staggered" id="menu-icon"></i>
        </button>
    </header>

    <aside id="sidebar" class="fixed left-0 top-0 h-full w-20 lg:w-80 bg-[#050505] border-r border-white/[0.03] flex flex-col z-[1000] transition-all duration-300">
        <div class="p-6 lg:p-8 border-b border-white/[0.03] flex items-center justify-center lg:justify-start gap-4 group">
            <div class="w-12 h-12 bg-gradient-to-br from-indigo-600 to-indigo-900 rounded-2xl flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
                <i class="fa-solid fa-infinity text-white text-2xl"></i>
            </div>
            <div class="hidden lg:block">
                <h1 class="text-xl font-black text-white uppercase tracking-tighter">Drop<span class="text-indigo-500">Bid</span></h1>
                <p class="text-[9px] text-slate-500 font-bold tracking-[0.2em] uppercase mt-1">Quantum Network</p>
            </div>
        </div>
        
        <div class="p-4 lg:p-6 border-b border-white/[0.03]">
            <div id="state-logged-out" class="flex flex-col gap-3">
                <button onclick="window.location.href='register.html'" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-xl text-[10px] font-black uppercase tracking-[0.2em] flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> <span class="hidden lg:inline">Créer un Accès</span>
                </button>
                <button onclick="window.location.href='login.html'" class="w-full border border-white/10 text-slate-400 p-3 rounded-xl text-[10px] font-black uppercase tracking-[0.2em] flex items-center justify-center gap-2">
                    <i class="fa-solid fa-fingerprint"></i> <span class="hidden lg:inline">S'identifier</span>
                </button>
            </div>
        </div>

        <nav class="flex-1 px-4 py-4 space-y-1 overflow-y-auto no-scrollbar">
            <p class="hidden lg:block text-[8px] text-slate-600 font-black uppercase tracking-[0.3em] px-4 mb-4 italic">Menu Terminal</p>
            
            <button onclick="window.location.href='../index.html'" class="nav-item w-full flex items-center justify-center lg:justify-start gap-4 p-4 rounded-xl text-slate-500 transition-all">
                <i class="fa-solid fa-house w-6 text-lg"></i> <span class="hidden lg:block font-bold text-sm">Tableau de Bord</span>
            </button>

            <button onclick="window.location.href='live.html'" class="nav-item w-full flex items-center justify-center lg:justify-start gap-4 p-4 rounded-xl text-slate-500 transition-all">
                <i class="fa-solid fa-chart-line w-6 text-lg"></i> <span class="hidden lg:block font-bold text-sm">Marché Live</span>
            </button>

            <button onclick="window.location.href='offer.html'" class="nav-item w-full flex items-center justify-center lg:justify-start gap-4 p-4 rounded-xl text-slate-500 transition-all">
                <i class="fa-solid fa-tag w-6 text-lg"></i> <span class="hidden lg:block font-bold text-sm">Déposer une offre</span>
            </button>

            <button onclick="window.location.href='inventory.html'" class="nav-item active-tab w-full flex items-center justify-center lg:justify-start gap-4 p-4 rounded-xl text-slate-500 transition-all">
                <i class="fa-solid fa-box-open w-6 text-lg"></i> <span class="hidden lg:block font-bold text-sm">Mon Inventaire</span>
            </button>

            <div class="h-px bg-white/[0.03] my-6 mx-4"></div>

            <button onclick="window.location.href='guide.html'" class="nav-item w-full flex items-center justify-center lg:justify-start gap-4 p-4 rounded-xl text-slate-500 transition-all">
                <i class="fa-solid fa-circle-info w-6 text-lg"></i> <span class="hidden lg:block font-bold text-sm">Aide & Guide</span>
            </button>
        </nav>
    </aside>

    <main class="main-content flex-1 ml-20 lg:ml-80 p-4 md:p-8 lg:p-12 mt-16 lg:mt-0 transition-all">
        <div class="max-w-6xl mx-auto animate-view-enter">
            
            <div class="relative overflow-hidden flex flex-col xl:flex-row justify-between items-start xl:items-center gap-6 bg-[#0d1117]/60 backdrop-blur-xl p-6 md:p-10 rounded-[2rem] md:rounded-[2.5rem] border border-white/[0.03] shadow-2xl mb-8 md:mb-12">
                <div class="absolute -top-24 -right-24 w-64 h-64 bg-indigo-600/10 rounded-full blur-[100px] pointer-events-none"></div>
                
                <div class="relative z-10">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_8px_#10b981]"></span>
                        <p class="text-[9px] md:text-[10px] text-emerald-500 font-black uppercase tracking-[0.3em]">Protocole de Sécurité Actif</p>
                    </div>
                    <h2 class="text-3xl md:text-4xl font-black text-white uppercase tracking-tighter italic">Mon <span class="text-indigo-500">Coffre-Fort</span></h2>
                </div>

                <div class="relative z-10 flex items-center gap-4 md:gap-6 bg-black/40 p-4 rounded-2xl md:rounded-3xl border border-white/[0.05] w-full md:w-auto min-w-[220px]">
                    <div class="text-right flex-1">
                        <p class="text-[8px] md:text-[9px] text-slate-500 font-bold uppercase tracking-widest mb-1">Valeur Estimée</p>
                        <p class="text-xl md:text-2xl font-mono font-bold text-white tracking-tighter">0.00€</p>
                    </div>
                    <div class="w-12 h-12 md:w-14 md:h-14 bg-indigo-600/20 rounded-xl md:rounded-2xl flex items-center justify-center text-indigo-400 border border-indigo-500/30">
                        <i class="fa-solid fa-vault text-xl md:text-2xl"></i>
                    </div>
                </div>
            </div>

            <div id="inv-empty" class="group text-center py-20 md:py-32 bg-[#0d1117]/20 rounded-[2.5rem] md:rounded-[3.5rem] border border-dashed border-white/5 px-4">
                <i class="fa-solid fa-box-open text-5xl md:text-6xl text-slate-800 mb-6 group-hover:text-indigo-500/20 transition-colors"></i>
                <h3 class="text-xl md:text-2xl text-white font-black uppercase mb-4">Aucun actif détecté</h3>
                <p class="text-slate-500 max-w-xs mx-auto text-sm mb-10">Votre inventaire est actuellement vide. Les actifs acquis via le Marché Live apparaîtront ici.</p>
                <button onclick="window.location.href='live.html'" class="w-full md:w-auto px-8 py-4 bg-white text-black rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-indigo-500 hover:text-white transition-all shadow-xl">
                    Scanner le Marché
                </button>
            </div>

        </div>
    </main>

    <script>
        function toggleMenu() {
            const sidebar = document.getElementById('sidebar');
            const icon = document.getElementById('menu-icon');
            sidebar.classList.toggle('open');
            if(sidebar.classList.contains('open')) {
                icon.classList.replace('fa-bars-staggered', 'fa-xmark');
            } else {
                icon.classList.replace('fa-xmark', 'fa-bars-staggered');
            }
        }

        // Fermer le menu si on clique en dehors (sur mobile)
        document.addEventListener('click', (e) => {
            const sidebar = document.getElementById('sidebar');
            const menuBtn = document.querySelector('header button');
            if (window.innerWidth < 1024 && 
                sidebar.classList.contains('open') && 
                !sidebar.contains(e.target) && 
                !menuBtn.contains(e.target)) {
                toggleMenu();
            }
        });
    </script>
</body>
</html>
