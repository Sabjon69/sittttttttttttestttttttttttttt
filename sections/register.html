<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DropBid | Quantum Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500;800&display=swap');
        
        :root { --p: #6366f1; --bg: #050505; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: white; margin: 0; overflow-x: hidden; }
        
        .scanner { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 50%, rgba(99, 102, 241, 0.05) 50%); background-size: 100% 4px; pointer-events: none; }
        .scan-bar { width: 100%; height: 2px; background: var(--p); position: absolute; box-shadow: 0 0 15px var(--p); animation: move 4s infinite linear; z-index: 50; }
        @keyframes move { 0% { top: 0%; } 100% { top: 100%; } }

        .quantum-card { background: rgba(10, 10, 10, 0.9); border: 1px solid rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); }
        .nav-item:hover { background: rgba(255, 255, 255, 0.02); color: white; }
        .active-tab { border-right: 4px solid var(--p); background: rgba(99, 102, 241, 0.05); color: white !important; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        input, select { background: #000 !important; border: 1px solid #222 !important; color: white !important; transition: 0.3s; width: 100%; }
        input:focus { border-color: var(--p) !important; box-shadow: 0 0 10px rgba(99, 102, 241, 0.2); }

        /* Mobile Sidebar Toggle */
        @media (max-width: 1023px) {
            #sidebar { transform: translateX(-100%); width: 280px; }
            #sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0 !important; }
        }
    </style>
</head>
<body class="min-h-screen flex">

    <button onclick="toggleSidebar()" class="lg:hidden fixed top-6 right-6 z-[2000] w-12 h-12 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg">
        <i class="fa-solid fa-bars-staggered text-white text-xl"></i>
    </button>

    <aside id="sidebar" class="fixed left-0 top-0 h-full w-80 bg-[#050505] border-r border-white/[0.03] flex flex-col z-[1500] transition-transform duration-300 lg:translate-x-0">
        
        <div class="p-8 border-b border-white/[0.03] flex items-center gap-4 group">
            <div class="w-12 h-12 bg-gradient-to-br from-indigo-600 to-indigo-900 rounded-2xl flex items-center justify-center shadow-lg">
                <i class="fa-solid fa-infinity text-white text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-black text-white uppercase tracking-tighter">Drop<span class="text-indigo-500">Bid</span></h1>
                <p class="text-[9px] text-slate-500 font-bold tracking-[0.2em] uppercase mt-1">Quantum Network</p>
            </div>
        </div>
        
        <div class="p-6 border-b border-white/[0.03]">
            <div id="state-logged-out" class="flex flex-col gap-3">
                <button onclick="showTab('audit')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white p-4 rounded-xl text-[10px] font-black uppercase tracking-[0.2em] flex items-center justify-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> Créer un Accès
                </button>
                <button onclick="window.location.href='sections/login.html'" class="w-full bg-white/5 border border-white/10 hover:border-indigo-500/50 text-slate-400 hover:text-white py-4 rounded-xl text-[10px] font-black uppercase tracking-[0.2em] transition-all flex items-center justify-center gap-3">
                    <i class="fa-solid fa-fingerprint"></i> S'identifier
                </button>
            </div>
        </div>

        <nav class="flex-1 px-4 py-4 space-y-1 overflow-y-auto no-scrollbar">
            <p class="text-[8px] text-slate-600 font-black uppercase tracking-[0.3em] px-4 mb-4 italic">Menu Terminal</p>
            <button onclick="showTab('home')" class="nav-item w-full flex items-center gap-4 p-4 rounded-xl text-slate-500 transition-all">
                <i class="fa-solid fa-house w-6 text-lg"></i> <span class="font-bold text-sm">Tableau de Bord</span>
            </button>
            <button class="nav-item w-full flex items-center gap-4 p-4 rounded-xl text-slate-500 transition-all">
                <i class="fa-solid fa-chart-line w-6 text-lg"></i> <span class="font-bold text-sm">Marché Live</span>
            </button>
            <button class="nav-item active-tab w-full flex items-center gap-4 p-4 rounded-xl text-slate-500 transition-all">
                <i class="fa-solid fa-user-shield w-6 text-lg"></i> <span class="font-bold text-sm">Audit Identité</span>
            </button>
        </nav>
    </aside>

    <main class="main-content flex-1 lg:ml-80 p-4 md:p-8 lg:p-12 transition-all">
        
        <div class="max-w-5xl mx-auto">

            <div id="tab-audit" class="tab-content">
                <div class="quantum-card rounded-[2rem] md:rounded-[3.5rem] overflow-hidden relative shadow-2xl">
                    <div class="scan-bar"></div>
                    <div class="scanner"></div>

                    <div class="p-6 md:p-12 lg:p-16 relative z-10">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-12 pb-8 border-b border-white/5">
                            <div>
                                <h2 class="text-3xl md:text-4xl font-black uppercase tracking-tighter italic">Identity <span class="text-indigo-500">Audit</span></h2>
                                <p class="text-[10px] text-slate-500 font-bold uppercase tracking-[0.3em] mt-2">Protocol de vérification niveau 4</p>
                            </div>
                            <i class="fa-solid fa-shield-virus text-4xl text-indigo-500/20 hidden md:block"></i>
                        </div>

                        <form class="space-y-10">
                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 md:gap-12">
                                <div class="space-y-6">
                                    <h3 class="text-[10px] font-black text-indigo-400 uppercase border-l-2 border-indigo-500 pl-3">01. État Civil</h3>
                                    <div class="flex flex-col sm:flex-row gap-4">
                                        <input type="text" placeholder="NOM" class="p-5 rounded-2xl text-sm font-bold uppercase">
                                        <input type="text" placeholder="PRÉNOM" class="p-5 rounded-2xl text-sm font-bold">
                                    </div>
                                    <input type="date" class="p-5 rounded-2xl text-sm font-mono">
                                </div>
                                
                                <div class="space-y-6">
                                    <h3 class="text-[10px] font-black text-indigo-400 uppercase border-l-2 border-indigo-500 pl-3">02. Localisation</h3>
                                    <input type="text" placeholder="ADRESSE PHYSIQUE" class="p-5 rounded-2xl text-sm">
                                    <input type="tel" placeholder="+33 _ __ __ __ __" class="p-5 rounded-2xl text-sm font-mono">
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 pt-10 border-t border-white/5">
                                <div class="h-40 md:h-48 bg-black/40 rounded-3xl border-2 border-dashed border-white/5 flex flex-col items-center justify-center group hover:border-indigo-500/50 transition-all cursor-pointer relative">
                                    <i class="fa-solid fa-id-card text-3xl text-slate-700 group-hover:text-indigo-500"></i>
                                    <p class="text-[8px] font-black mt-4 text-slate-500 uppercase">Pièce d'identité</p>
                                    <input type="file" class="absolute inset-0 opacity-0 cursor-pointer">
                                </div>
                                <div class="h-40 md:h-48 bg-black/40 rounded-3xl border-2 border-dashed border-white/5 flex flex-col items-center justify-center group hover:border-indigo-500/50 transition-all cursor-pointer relative">
                                    <i class="fa-solid fa-face-viewfinder text-3xl text-slate-700 group-hover:text-indigo-500"></i>
                                    <p class="text-[8px] font-black mt-4 text-slate-500 uppercase">Scan Facial Live</p>
                                    <input type="file" class="absolute inset-0 opacity-0 cursor-pointer">
                                </div>
                                <div class="h-40 md:h-48 bg-black/40 rounded-3xl border-2 border-dashed border-white/5 flex flex-col items-center justify-center group hover:border-indigo-500/50 transition-all cursor-pointer relative">
                                    <i class="fa-solid fa-file-invoice text-3xl text-slate-700 group-hover:text-indigo-500"></i>
                                    <p class="text-[8px] font-black mt-4 text-slate-500 uppercase">Justificatif Domicile</p>
                                    <input type="file" class="absolute inset-0 opacity-0 cursor-pointer">
                                </div>
                            </div>

                            <button type="button" class="w-full py-6 md:py-8 bg-white text-black font-black uppercase text-xs md:text-sm tracking-[0.5em] rounded-[1.5rem] md:rounded-3xl hover:bg-indigo-600 hover:text-white transition-all shadow-2xl active:scale-95">
                                Synchroniser Profil
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div id="tab-home" class="tab-content hidden">
                <h2 class="text-4xl font-black mb-10 italic uppercase">Terminal <span class="text-indigo-500">Flux</span></h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="quantum-card p-8 rounded-[2rem]">
                        <p class="text-[10px] text-indigo-500 font-black mb-2 uppercase">Réseau</p>
                        <p class="text-2xl font-black uppercase tracking-tighter text-white">Actif</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active-tab'));
            
            document.getElementById('tab-' + id).classList.remove('hidden');
            event.currentTarget.classList.add('active-tab');
            
            // Ferme la sidebar sur mobile après clic
            if(window.innerWidth < 1024) toggleSidebar();
        }
    </script>
</body>
</html>
