<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Effet de grille de fond (Dots) */
        .bg-dots {
            background-image: radial-gradient(rgba(99, 102, 241, 0.15) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        /* Animation de scan progressif */
        .scan-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #6366f1, transparent);
            position: absolute;
            animation: scanning 3s infinite linear;
        }
        @keyframes scanning {
            0% { left: -100%; width: 30%; }
            100% { left: 100%; width: 50%; }
        }

        .quantum-card {
            position: relative;
            background: rgba(1, 4, 9, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="bg-transparent">
    <div class="animate-view-enter max-w-xl mx-auto mt-12 px-4 pb-20">
        
        <div class="quantum-card rounded-[3.5rem] p-1 shadow-2xl overflow-hidden">
            
            <div class="absolute inset-0 bg-dots opacity-40 pointer-events-none"></div>
            
            <div class="relative glass-panel p-10 lg:p-12 rounded-[3.4rem] bg-[#010409]/90 backdrop-blur-3xl z-10">
                
                <div class="flex flex-col items-center mb-12">
                    <div class="relative mb-6">
                        <div class="absolute -inset-4 border border-indigo-500/20 rounded-full animate-spin [animation-duration:8s]"></div>
                        <div class="absolute -inset-2 border border-dashed border-indigo-500/10 rounded-full animate-spin [animation-duration:4s] direction-reverse"></div>
                        
                        <div class="w-24 h-24 bg-gradient-to-br from-indigo-900/50 to-slate-900 rounded-[2rem] flex items-center justify-center border border-indigo-500/30 shadow-[0_0_50px_rgba(79,70,229,0.15)] relative z-10">
                            <i class="fa-solid fa-user-plus text-4xl text-indigo-400"></i>
                        </div>
                    </div>

                    <h2 class="text-4xl font-black text-white uppercase tracking-tighter italic leading-none text-center">
                        Initialize <span class="text-indigo-500">Access</span>
                    </h2>
                    
                    <div class="flex items-center gap-4 mt-4 overflow-hidden w-full max-w-[200px] h-1 bg-slate-800/50 rounded-full relative">
                        <div class="scan-bar"></div>
                    </div>
                    <p class="text-[8px] text-indigo-500/50 font-black uppercase tracking-[0.4em] mt-3">Quantum Protocol Setup</p>
                </div>

                <div class="space-y-8">
                    <div class="grid grid-cols-2 gap-6">
                        <div class="group">
                            <label class="text-[9px] text-slate-500 font-black uppercase tracking-[0.2em] ml-2 mb-2 block group-focus-within:text-indigo-400 transition-colors">Forename</label>
                            <input type="text" class="w-full bg-black/40 border border-white/5 rounded-2xl p-4 text-white focus:outline-none focus:border-indigo-500/50 focus:ring-4 focus:ring-indigo-500/5 transition-all text-sm placeholder:text-slate-800" placeholder="John">
                        </div>
                        <div class="group">
                            <label class="text-[9px] text-slate-500 font-black uppercase tracking-[0.2em] ml-2 mb-2 block group-focus-within:text-indigo-400 transition-colors">Surname</label>
                            <input type="text" class="w-full bg-black/40 border border-white/5 rounded-2xl p-4 text-white focus:outline-none focus:border-indigo-500/50 focus:ring-4 focus:ring-indigo-500/5 transition-all text-sm placeholder:text-slate-800" placeholder="Doe">
                        </div>
                    </div>

                    <div class="group">
                        <div class="flex justify-between items-center px-2 mb-2">
                            <label class="text-[9px] text-slate-500 font-black uppercase tracking-[0.2em] group-focus-within:text-indigo-400">Network ID</label>
                           <span id="user-check" class="text-[8px] text-slate-700 font-mono uppercase tracking-tighter transition-colors">Vérification ID...</span>
                        </div>
                        <div class="relative">
                            <div class="absolute left-5 top-1/2 -translate-y-1/2 text-indigo-500/50">
                                <i class="fa-solid fa-at text-xs"></i>
                            </div>
                            <input type="text" id="register-username" 
                                class="w-full bg-black/60 border border-white/5 rounded-2xl py-5 pl-12 pr-6 text-white focus:outline-none focus:border-indigo-500/50 focus:ring-4 focus:ring-indigo-500/10 transition-all font-mono text-sm" 
                                placeholder="operator_identity">
                        </div>
                    </div>

                    <div class="pt-6">
                        <button onclick="executeLoginFromRegister()" 
                            class="group relative w-full h-20 overflow-hidden rounded-[2rem] bg-white text-black font-black uppercase text-xs tracking-[0.4em] transition-all hover:tracking-[0.6em] active:scale-[0.98] shadow-2xl">
                            <div class="absolute inset-0 bg-indigo-600 translate-y-full group-hover:translate-y-0 transition-transform duration-500 ease-out"></div>
                            
                            <span class="relative z-10 flex items-center justify-center gap-3 group-hover:text-white transition-colors duration-500">
                                Confirm Credentials
                                <i class="fa-solid fa-arrow-right-long animate-pulse"></i>
                            </span>
                        </button>
                    </div>

                    <div class="flex flex-col items-center gap-6 mt-10">
                        <div class="flex items-center gap-3">
                            <span class="w-1.5 h-1.5 bg-indigo-500 rounded-full"></span>
                            <span class="w-1.5 h-1.5 bg-indigo-500/30 rounded-full"></span>
                            <span class="w-1.5 h-1.5 bg-indigo-500/30 rounded-full"></span>
                        </div>
                        
                        <p class="text-[9px] text-slate-500 text-center leading-relaxed max-w-xs uppercase tracking-widest font-bold">
                            By deploying, you agree to the <span class="text-white">Quantum Privacy layers</span> and data encryption laws.
                        </p>
                        
                        <button onclick="switchTab('login', event)" class="text-xs text-indigo-400 hover:text-white font-black uppercase tracking-tighter transition-all hover:underline decoration-2 underline-offset-8">
                            Already have access ?
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
