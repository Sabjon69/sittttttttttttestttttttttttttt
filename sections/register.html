<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IRYON | Créer un Accès Quantum</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800;1000&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #020202; 
            color: #e2e8f0; 
            margin: 0;
            overflow-x: hidden;
        }

        .bg-grid {
            position: fixed; inset: 0;
            background-image: radial-gradient(circle at 2px 2px, rgba(99, 102, 241, 0.05) 1px, transparent 0);
            background-size: 40px 40px;
            z-index: -1;
        }

        .scanner { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 50%, rgba(99, 102, 241, 0.02) 50%); background-size: 100% 4px; pointer-events: none; }
        .scan-bar { width: 100%; height: 2px; background: #6366f1; position: absolute; box-shadow: 0 0 15px #6366f1; animation: move 4s infinite linear; z-index: 50; }
        @keyframes move { 0% { top: 0%; } 100% { top: 100%; } }

        .sidebar-fixed {
            width: 320px; height: 100vh; background: #050505; border-right: 1px solid rgba(255, 255, 255, 0.03);
            position: fixed; left: 0; top: 0; z-index: 1000; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .main-container { margin-left: 320px; transition: all 0.4s; }

        @media (max-width: 1024px) {
            .sidebar-fixed { transform: translateX(-100%); width: 280px; }
            .sidebar-fixed.open { transform: translateX(0); }
            .main-container { margin-left: 0; }
        }

        .quantum-card { background: rgba(10, 10, 10, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); }
        input { background: #000 !important; border: 1px solid #222 !important; color: white !important; transition: 0.3s; }
        input:focus { border-color: #6366f1 !important; box-shadow: 0 0 15px rgba(99, 102, 241, 0.1); }
        
        .nav-active { background: rgba(99, 102, 241, 0.08); border-left: 4px solid #6366f1; color: white !important; }
        .dot-live { width: 8px; height: 8px; background: #6366f1; border-radius: 50%; box-shadow: 0 0 10px #6366f1; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } }
    </style>
</head>
<body class="antialiased">

    <div class="bg-grid"></div>

    <header class="lg:hidden flex items-center justify-between p-6 bg-[#050505]/95 backdrop-blur-xl border-b border-white/5 sticky top-0 z-[1100] min-h-[140px]">
        <div class="flex items-center gap-6" onclick="window.location.href='../index.html'">
            <div class="w-[100px] h-[100px] bg-indigo-500/5 border border-indigo-500/20 rounded-[2rem] flex items-center justify-center overflow-hidden shadow-[0_0_40px_rgba(79,70,229,0.2)]">
                <img src="assets/logo.png" alt="Logo IRYON" class="w-full h-full object-contain p-1 transform scale-150">
            </div>
            <div class="flex flex-col">
                <h1 class="font-[1000] uppercase tracking-tighter text-white italic text-4xl leading-[0.8] mb-2">IRYON<br><span class="text-indigo-500 not-italic">ENCHÈRES</span></h1>
                <div class="flex items-center gap-2">
                    <div class="dot-live"></div>
                    <span class="text-[10px] text-slate-500 font-black uppercase tracking-[0.4em] italic">Quantum Live</span>
                </div>
            </div>
        </div>
        <button onclick="toggleSidebar()" class="w-16 h-16 flex items-center justify-center rounded-[1.5rem] bg-white/5 border border-white/10 text-white text-3xl">
            <i class="fa-solid fa-bars-staggered" id="menu-icon"></i>
        </button>
    </header>

    <aside id="sidebar" class="sidebar-fixed flex flex-col bg-[#050505]">
        <div class="p-8 lg:p-10 border-b border-white/[0.03] relative overflow-hidden flex items-center justify-start min-h-[160px]">
            <div class="absolute -left-5 -top-5 w-32 h-32 bg-indigo-600/10 blur-[50px] rounded-full pointer-events-none"></div>
            <div class="flex items-center gap-6 group cursor-pointer relative z-10" onclick="window.location.href='../index.html'">
                <div class="w-16 h-16 lg:w-20 lg:h-20 bg-white/[0.02] border border-white/10 rounded-2xl flex items-center justify-center overflow-hidden">
                    <img src="assets/logo.png" alt="Logo" class="w-full h-full object-contain transform scale-150">
                </div>
                <div>
                    <h1 class="text-2xl lg:text-3xl font-[1000] text-white uppercase tracking-tighter leading-[0.85] italic">IRYON<br><span class="text-indigo-500 not-italic">ENCHÈRES</span></h1>
                </div>
            </div>
        </div>
        
        <nav class="flex-1 px-4 lg:px-6 py-8 space-y-2">
            <button onclick="window.location.href='../index.html'" class="w-full flex items-center gap-5 p-4 rounded-2xl text-slate-500 hover:bg-white/5 transition-all">
                <i class="fa-solid fa-house text-xl"></i> <span class="font-bold text-sm tracking-wide">Tableau de Bord</span>
            </button>
            <button onclick="window.location.href='live.html'" class="w-full flex items-center gap-5 p-4 rounded-2xl text-slate-500 hover:bg-white/5 transition-all">
                <i class="fa-solid fa-chart-line text-xl"></i> <span class="font-bold text-sm tracking-wide">Marché Live</span>
            </button>
            <button class="w-full flex items-center gap-5 p-4 rounded-2xl nav-active text-white">
                <i class="fa-solid fa-user-plus text-xl text-indigo-400"></i> <span class="font-bold text-sm tracking-wide">Créer un Accès</span>
            </button>
            <div class="h-px bg-white/[0.03] my-8 mx-4"></div>
            <button onclick="window.location.href='login.html'" class="w-full flex items-center gap-5 p-4 rounded-2xl text-slate-500 hover:bg-white/5 transition-all">
                <i class="fa-solid fa-fingerprint text-xl"></i> <span class="font-bold text-sm tracking-wide">S'identifier</span>
            </button>
        </nav>
    </aside>

    <main class="main-container">
        <div class="max-w-5xl mx-auto p-6 md:p-20">
            
            <div class="quantum-card rounded-[2.5rem] md:rounded-[3.5rem] overflow-hidden relative shadow-2xl">
                <div class="scan-bar"></div>
                <div class="scanner"></div>

                <div class="p-8 md:p-16 relative z-10">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-12 pb-8 border-b border-white/5">
                        <div>
                            <p class="text-indigo-500 font-black uppercase tracking-[0.3em] text-[10px] mb-2">Protocol de vérification niveau 4</p>
                            <h2 class="text-4xl md:text-5xl font-[1000] uppercase tracking-tighter italic text-white">Identity <span class="text-indigo-500">Audit</span></h2>
                        </div>
                        <i class="fa-solid fa-shield-halved text-5xl text-indigo-500/20"></i>
                    </div>

                    <form class="space-y-10">
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                            <div class="space-y-6">
                                <h3 class="text-[10px] font-black text-indigo-400 uppercase border-l-2 border-indigo-500 pl-3">01. État Civil</h3>
                                <div class="grid grid-cols-2 gap-4">
                                    <input type="text" placeholder="NOM" class="p-5 rounded-2xl text-sm font-bold uppercase">
                                    <input type="text" placeholder="PRÉNOM" class="p-5 rounded-2xl text-sm font-bold">
                                </div>
                                <input type="date" class="w-full p-5 rounded-2xl text-sm font-mono">
                            </div>
                            
                            <div class="space-y-6">
                                <h3 class="text-[10px] font-black text-indigo-400 uppercase border-l-2 border-indigo-500 pl-3">02. Communication</h3>
                                <input type="email" placeholder="EMAIL DE RÉCUPÉRATION" class="w-full p-5 rounded-2xl text-sm">
                                <input type="tel" placeholder="+33 _ __ __ __ __" class="w-full p-5 rounded-2xl text-sm font-mono">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 pt-10 border-t border-white/5">
                            <div class="h-40 bg-black/40 rounded-3xl border-2 border-dashed border-white/5 flex flex-col items-center justify-center group hover:border-indigo-500/50 transition-all cursor-pointer relative">
                                <i class="fa-solid fa-id-card text-3xl text-slate-700 group-hover:text-indigo-500"></i>
                                <p class="text-[8px] font-black mt-4 text-slate-500 uppercase">Pièce d'identité</p>
                                <input type="file" class="absolute inset-0 opacity-0 cursor-pointer">
                            </div>
                            <div class="h-40 bg-black/40 rounded-3xl border-2 border-dashed border-white/5 flex flex-col items-center justify-center group hover:border-indigo-500/50 transition-all cursor-pointer relative">
                                <i class="fa-solid fa-face-viewfinder text-3xl text-slate-700 group-hover:text-indigo-500"></i>
                                <p class="text-[8px] font-black mt-4 text-slate-500 uppercase">Scan Facial Live</p>
                                <input type="file" class="absolute inset-0 opacity-0 cursor-pointer">
                            </div>
                            <div class="h-40 bg-black/40 rounded-3xl border-2 border-dashed border-white/5 flex flex-col items-center justify-center group hover:border-indigo-500/50 transition-all cursor-pointer relative">
                                <i class="fa-solid fa-file-invoice text-3xl text-slate-700 group-hover:text-indigo-500"></i>
                                <p class="text-[8px] font-black mt-4 text-slate-500 uppercase">Justificatif Domicile</p>
                                <input type="file" class="absolute inset-0 opacity-0 cursor-pointer">
                            </div>
                        </div>

                        <button type="button" class="w-full py-8 bg-white text-black font-[1000] uppercase text-xs tracking-[0.5em] rounded-3xl hover:bg-indigo-600 hover:text-white transition-all shadow-2xl active:scale-95">
                            Synchroniser Profil Quantum
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const icon = document.getElementById('menu-icon');
            sidebar.classList.toggle('open');
            if(sidebar.classList.contains('open')) {
                icon.classList.replace('fa-bars-staggered', 'fa-xmark');
            } else {
                icon.classList.replace('fa-xmark', 'fa-bars-staggered');
            }
        }
    </script>
</body>
</html>
